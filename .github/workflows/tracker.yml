name: GitHub Projects Automation

on:
  pull_request:
    types:
      - closed

jobs:
  move-issue-to-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Confirm pull request was merged
        run: echo "Pull request was merged. Linked issue should be moved to Done manually or through GitHub Projects automation."
